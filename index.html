<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Abhimanyu Technologies — Scale Your Business</title>

    <style>
      :root {
        --bg: #090909;
        --bg-alt: #10151f;
        --surface: rgba(255, 255, 255, 0.03);
        --text: #f4efe6;
        --muted: #c8bfae;
        --gold: #d4af37;
        --gold-bright: #f3e5ab;
        --gold-soft: rgba(212, 175, 55, 0.14);
        --blue: #4fb3ff;
        --blue-soft: rgba(79, 179, 255, 0.12);
        --line: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      /*
        Fix: html itself had no background before. On iOS Safari / overscroll
        bounce, the browser paints the <html> canvas behind the body, which
        defaulted to white. Every layer below is now pinned to --bg so there
        is no seam, no matter how far the page rubber-bands.
      */
      html {
        background-color: var(--bg) !important;
        overscroll-behavior: none;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg) !important;
        -ms-overflow-style: none;
        scrollbar-width: none;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        overflow-x: hidden;
        overscroll-behavior: none;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04), transparent 26%),
          radial-gradient(circle at top left, var(--gold-soft), transparent 30%),
          radial-gradient(circle at 82% 18%, var(--blue-soft), transparent 24%),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.03), transparent 28%),
          linear-gradient(180deg, #090909 0%, #10151f 100%) var(--bg) !important;
        line-height: 1.5;
      }

      #root {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 22%),
          radial-gradient(circle at 50% 0%, rgba(79, 179, 255, 0.05), transparent 40%) var(--bg) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          inset 0 0 120px rgba(212, 175, 55, 0.035),
          inset 0 0 140px rgba(79, 179, 255, 0.03);
      }

      ::selection {
        background: rgba(212, 175, 55, 0.24);
        color: var(--text);
      }

      ::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
