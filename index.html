      :root {

        Clean White / Whitish Enterprise B2B Platform

      html {

        overscroll-behavior: none;
      }

        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg) !important;
        -ms-overflow-style: none;
        scrollbar-width: none;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        overflow-x: hidden;
        overscroll-behavior: none;
        background:
          radial-gradient(circle at 80% 10%, rgba(29, 78, 216, 0.04), transparent 35%),
          radial-gradient(circle at 10% 80%, rgba(13, 148, 136, 0.04), transparent 30%),
          linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 40%, #F1F5F9 100%) var(--bg) !important;
        line-height: 1.5;
      }

      #root {
        background: transparent !important;
        box-shadow: none;
      }

      ::selection {
        background: rgba(217, 119, 6, 0.20);
        color: var(--text);
      }

      ::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
