    <style>
      :root {
        --bg: #0A0F1D;
        --surface: #0F172A;
        --text: #F8FAFC;
        --muted: #94A3B8;
        --blue: #2563EB;
        --line: rgba(56, 189, 248, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      @keyframes eqPulse {
        0% { transform: scaleY(0.2); }
        100% { transform: scaleY(1); }
      }

      /* Completely remove native default browser vertical scrollbar */
      html,
      body {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
        overflow-y: scroll;
      }

      ::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
        background: transparent !important;
      }

      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--bg) !important;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: var(--text);
        background-color: var(--bg) !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        overflow-x: hidden;
        line-height: 1.6;
      }

      #root {
        background: transparent !important;
      }

      ::selection {
        background: rgba(37, 99, 235, 0.15);
        color: var(--text);
      }

      .flip-card-container:hover .flip-card-inner {
        transform: rotateY(180deg);
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .typing-cursor {
        animation: blink 0.9s step-start infinite;
        font-weight: 300;
        color: #2563EB;
      }

      @keyframes marquee-scroll {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee-scroll 28s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }

      .hud-hero-card {
        background: rgba(10, 20, 38, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 189, 248, 0.45);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.25);
        border-radius: 14px;
        padding: 12px 18px;
        color: #FFFFFF;
        position: absolute;
        z-index: 10;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      @keyframes fadeInLeft {
        from { opacity: 0; transform: translateX(8px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes dotPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 10px #38BDF8; }
        50% { transform: scale(1.25); box-shadow: 0 0 20px #38BDF8, 0 0 12px #FFD700; }
      }

      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes oscWave {
        0% { transform: scaleY(0.7) translateY(1px); }
        50% { transform: scaleY(1.4) translateY(-1px); }
        100% { transform: scaleY(0.9) translateY(0px); }
      }


      @media (max-width: 868px) {
        .floating-dots-rail {
          right: 2px !important;
          width: 14px !important;
          padding: 6px 1px !important;
          background: rgba(10, 15, 29, 0.6) !important;
        }
        .floating-dots-rail .dot-btn {
          width: 6px !important;
          height: 6px !important;
        }
        .floating-dots-rail .dot-tooltip {
          display: none !important;
        }
        .hud-hero-card {
          display: none !important;
        }
        .desktop-nav {
          display: none !important;
        }
        .desktop-only-btn {
          display: none !important;
        }
        .mobile-toggle {
          display: flex !important;
        }
        .hero-title {
          font-size: 32px !important;
        }
        .hero-subtitle {
          font-size: 15px !important;
        }
        .hero-grid {
          grid-template-columns: 1fr !important;
        }
        .studio-layout {
          grid-template-columns: 1fr !important;
        }
        .phone-showcase {
          grid-template-columns: 1fr !important;
        }
        .building-layout {
          grid-template-columns: 1fr !important;
        }
        .estimator-grid {
          grid-template-columns: 1fr !important;
        }
        .contact-wrapper {
          grid-template-columns: 1fr !important;
        }
        .footer-grid {
          grid-template-columns: 1fr !important;
          gap: 32px !important;
        }
        .stats-grid {
          grid-template-columns: repeat(2, 1fr) !important;
        }
        .search-text-label {
          display: none !important;
        }
      }

      @media print {
        header, nav, #top canvas, footer, button, input, .marquee-track {
          display: none !important;
        }
        body, html, #root {
          background: #FFFFFF !important;
          color: #0F172A !important;
        }
        #estimate {
          padding: 20px 0 !important;
          background: #FFFFFF !important;
        }
        .estimator-grid {
          display: block !important;
        }
      }
    </style>
