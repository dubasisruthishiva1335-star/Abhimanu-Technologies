events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream tracking
    log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr latency: ${request_time}s';

    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstream Pool for Backend Workers (Least Connections Load Balancing)
    upstream backend_cluster {
        least_conn;
        server backend-node-1:5001 max_fails=2 fail_timeout=10s;
        server backend-node-2:5002 max_fails=2 fail_timeout=10s;
        server backend-node-3:5003 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Rate Limiting Zone (100 requests per minute per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    server {
        listen 80;
        server_name localhost abhimanu-technologies.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Load-Balancer "Abhimanyu-Nginx-L7" always;

        # Load Balancer Status Endpoint
        location /lb-status {
            default_type application/json;
            return 200 '{"service":"Nginx L7 Load Balancer","status":"ONLINE","algorithm":"least_conn","upstreams":["backend-node-1:5001","backend-node-2:5002","backend-node-3:5003"]}';
        }

        # API Routes forwarded to Upstream Cluster with Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Upstream-Selected $upstream_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Automatic failover to next upstream if current fails
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }

        # Static Frontend Fallback
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
